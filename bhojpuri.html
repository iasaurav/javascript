<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Playlist Gallery + Search</title>

  <!-- Video.js CSS -->
  <link rel="stylesheet"
    href="https://vjs.zencdn.net/7.8.4/video-js.css" />

  <style>
  .player-box {
    display: none;
  }
</style>

  
  
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    /* Player Box */
    .player-box {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    /* Search Box */
    .search-box {
      margin: 25px auto;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ccc;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: black;
    }

    /* Thumbnail Grid */
    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .thumb {
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      transition: 0.2s;
      padding-bottom: 10px;
    }

    .thumb:hover {
      transform: scale(1.05);
    }

    .thumb img {
      width: 100%;
      display: block;
      border-bottom: 1px solid #ddd;
    }

    .title {
      font-size: 14px;
      font-weight: bold;
      padding: 8px;
      color: #333;
    }

    .active {
      border: 4px solid black;
    }

    .no-result {
      font-size: 18px;
      margin-top: 20px;
      color: red;
    }
  </style>
</head>

<body>

  

  

  <!-- Search Filter -->
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search  title..."
    />
  </div>

  <!-- Thumbnail Grid -->
  <div class="grid" id="thumbGrid"></div>

  <p class="no-result" id="noResult" style="display:none;">
    ❌ No videos found!
  </p>
<!-- Player -->

  <div class="player-box">

    <video

      id="vid1"

      class="video-js vjs-default-skin"

      controls

      autoplay

      width="750"

      height="420">

    </video>

  </div>
  <!-- Video.js Scripts -->
  <script src="https://vjs.zencdn.net/7.8.4/video.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/2.6.1/Youtube.min.js"></script>

  <script>
    // ✅ Google Sheet URL (Column A = ID, Column B = Title)
    const sheetURL =
      "https://docs.google.com/spreadsheets/d/1nMOSo-1YmviPyhOo_Vw9dx9v4cPqRpXdHeEcaBiS2H4/gviz/tq?tqx=out:json&gid=1499337155&tq=SELECT%20E,F";

    let videoList = [];
    let filteredList = [];
    let player;
    let currentIndex = 0;

    const grid = document.getElementById("thumbGrid");
    const searchInput = document.getElementById("searchInput");
    const noResult = document.getElementById("noResult");

    // ✅ Fetch Video IDs + Titles
    fetch(sheetURL)
      .then(res => res.text())
      .then(data => {

        const json = JSON.parse(
          data.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1]
        );

        // Extract video data
        videoList = json.table.rows.map(r => ({
          id: r.c[0]?.v,
          title: r.c[1]?.v || "No Title"
        }))
        .filter(v => v.id);

        filteredList = videoList;

        // Show thumbnails
        showThumbnails(filteredList);

        // Start first video
        startPlayer(0);
      });

    // ✅ Display Thumbnails
    function showThumbnails(list) {
      grid.innerHTML = "";

      if (list.length === 0) {
        noResult.style.display = "block";
        return;
      } else {
        noResult.style.display = "none";
      }

      list.forEach((video, index) => {
        const div = document.createElement("div");
        div.className = "thumb";

        div.innerHTML = `
          <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg">
          <div class="title">${video.title}</div>
        `;

        // Click → Play selected video
        div.onclick = () => startPlayer(index, list);

        grid.appendChild(div);
      });
    }

    // ✅ Play Video Function
    function startPlayer(index, list = filteredList) {
      currentIndex = index;
      filteredList = list;

      // Highlight Active Thumbnail
      document.querySelectorAll(".thumb").forEach(t =>
        t.classList.remove("active")
      );

      document.querySelectorAll(".thumb")[index]?.classList.add("active");

      const videoURL =
        "https://www.youtube.com/watch?v=" + list[index].id;

      if (!player) {
        // First Init
        player = videojs("vid1", {
          techOrder: ["youtube"],
          sources: [{
            type: "video/youtube",
            src: videoURL
          }]
        });

        player.on("ended", playNext);

      } else {
        // Change Video
        player.src({
          type: "video/youtube",
          src: videoURL
        });

        player.play();
      }
    }

    // ✅ Auto Next Video
    function playNext() {
      let next = currentIndex + 1;

      if (next < filteredList.length) {
        startPlayer(next, filteredList);
      } else {
        alert("✅ Playlist Finished!");
      }
    }

    // ✅ Search Filter + Pause Video
    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.toLowerCase();

      // ✅ Pause current video while searching
      if (player) {
        player.pause();
      }

      // Filter videos by title
      filteredList = videoList.filter(video =>
        video.title.toLowerCase().includes(keyword)
      );

      // Update grid
      showThumbnails(filteredList);

      // ❌ No autoplay on search
    });
  </script>

</body>
</html>
